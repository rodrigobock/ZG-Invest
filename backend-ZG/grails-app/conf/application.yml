---
grails:
    profile: rest-api
    codegen:
        defaultPackage: zg
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false
    cors:
        enabled: true
        all:
            allowedOrigins: [ '*' ]
            allowedMethods: [ 'GET', 'POST', 'PUT', 'DELETE', 'OPTIONS' ]
            allowedHeaders: [ 'Origin', 'Authorization', 'Content-Type', 'X-Requested-With' ]
            exposeHeaders: [ 'ETag' ]
            allowCredentials: false
            maxAge: 3600

info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?currentSchema=bolsa&socketTimeout=30&connectTimeout=10&tcpKeepAlive=true}
        username: ${SPRING_DATASOURCE_USERNAME:postgres.jdsgehsflfwzlatcrjpj}
        password: ${SPRING_DATASOURCE_PASSWORD:YKDkuwPYMJFflBoi}
        driverClassName: org.postgresql.Driver
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQL14Dialect
        hibernate:
            ddl-auto: none
        open-in-view: false
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback.groovy'
                - '*.properties'
environments:
    development:
        management:
            endpoints:
                enabled-by-default: true
                web:
                    base-path: '/actuator'
                    exposure:
                        include: '*'
    production:
        management:
            endpoints:
                enabled-by-default: false
                web:
                    exposure:
                        include: 'health'
            endpoint:
                health:
                    enabled: true

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            json:
              - application/json
              - text/json   
            hal:
              - application/hal+json
              - application/hal+xml  
            xml:
              - text/xml
              - application/xml                                 
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            js: text/javascript
            rss: application/rss+xml
            text: text/plain
            all: '*/*'            
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
    default_schema: bolsa
    osiv:
        enabled: false
dataSource:
    pooled: true
    jmxExport: true
    driverClassName: org.postgresql.Driver
    username: postgres
    password: admin

environments:
    development:
        dataSource:
            dbCreate: none
            url: jdbc:postgresql://localhost:5432/postgres?currentSchema=bolsa
    production:
        dataSource:
            dbCreate: none
            url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?currentSchema=bolsa&socketTimeout=30&connectTimeout=10&tcpKeepAlive=true}
            username: ${SPRING_DATASOURCE_USERNAME:postgres.jdsgehsflfwzlatcrjpj}
            password: ${SPRING_DATASOURCE_PASSWORD:YKDkuwPYMJFflBoi}
            properties:
                jmxEnabled: true
                initialSize: 1
                maxActive: 10
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED
